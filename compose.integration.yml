services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sci_search_test
      POSTGRES_USER: sci_search
      POSTGRES_PASSWORD: sci_search_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sci_search -d sci_search_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: cgr.dev/chainguard/minio:latest-dev@sha256:22660c7a21cfe5ff9cb3376af8f00d5475a0bf15e4a8ad3951d7ad99a9adf2e1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sci_search
      MINIO_ROOT_PASSWORD: sci_search_test_password
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data

  redis:
    image: redis:8.2-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
