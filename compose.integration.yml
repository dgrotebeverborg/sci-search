services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sci_search_test
      POSTGRES_USER: sci_search
      POSTGRES_PASSWORD: sci_search_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sci_search -d sci_search_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sci_search
      MINIO_ROOT_PASSWORD: sci_search_test_password
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
