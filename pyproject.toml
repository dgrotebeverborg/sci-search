[project]
name = "sci-search"
version = "0.1.0"
description = "Provenance-aware scientific evidence search"
readme = "README.md"
license = "MIT"
authors = [{ name = "Sci-Search contributors" }]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "authlib>=1.7,<2",
    "boto3>=1.40,<2",
    "dramatiq[redis]>=1.18,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.22,<1",
    "pypdf>=6.0,<7",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<3",
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.35,<1",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://example.invalid/sci-search"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.7,<3",
  "playwright>=1.55,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
  "httpx2>=2,<3",
]
data = [
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
]

[project.scripts]
sci-search = "sci_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sci_search*"]

[tool.setuptools.package-data]
"sci_search" = ["frontend/templates/*.html", "frontend/static/*.css", "frontend/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib --cov-config=pyproject.toml"
markers = [
  "security: mandatory tenant-isolation and authentication security tests",
  "retained_corpus: requires locally retained full texts or historical research runs; enable with --run-retained-corpus",
  "live_data: queries real statistical APIs and a configured model; enable with --run-live-data",
]

[tool.coverage.run]
branch = true
source = ["sci_search"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "benchmarks",
  "build",
  "corpora",
  "data",
  "dist",
  "docs",
  "examples",
  "fixtures",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["sci_search"]
extraPaths = [".venv/lib64/python3.11/site-packages"]
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportMissingImports = "warning"
reportOperatorIssue = "warning"
reportOptionalIterable = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalOperand = "warning"
reportOptionalSubscript = "warning"
