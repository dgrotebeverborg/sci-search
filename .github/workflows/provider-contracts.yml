name: Provider contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: provider-contracts
  cancel-in-progress: false

jobs:
  bounded-provider-check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: provider-contracts
    timeout-minutes: 15
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: mistral-small-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - name: Run locked, bounded live scientific cases
        run: >-
          uv run python scripts/run_researcher_benchmark.py
          --benchmark benchmarks/researcher_questions_v1.json
          --case energy-iron-air-rte-comparability
          --case agriculture-biochar-yield-heterogeneity
          --case boundary-wild-goat-population
          --per-query 5 --max-full-texts 2 --max-acquisition-attempts 6
          --output provider-contract-result.raw.json
      - name: Validate lock and sanitize informational diagnostics
        if: always()
        run: >-
          uv run python scripts/sanitize_scheduled_result.py
          --protocol benchmarks/scheduled_scientific_protocol_v1.json
          --questions benchmarks/researcher_questions_v1.json
          --input provider-contract-result.raw.json
          --output provider-contract-result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-provider-contract-diagnostics
          path: provider-contract-result.json
          retention-days: 30
