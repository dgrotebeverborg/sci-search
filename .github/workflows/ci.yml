name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.11
      - name: Reject committed secrets
        run: uv run python scripts/check_no_secrets.py
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  tests:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Select a stable Python release
        uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: false
      - run: uv sync --frozen --extra dev --python "${{ steps.python.outputs.python-path }}"
      - name: Install Python execution sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2
          # Ubuntu's runner policy otherwise denies bwrap's isolated loopback setup.
          # Enable user namespaces on this disposable CI VM; bwrap and seccomp still
          # enforce the application's network, filesystem and process isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Python execution sandbox
        run: uv run python -m pytest tests/test_python_data_execution.py -q
      - name: Install browser test dependencies
        run: uv run python -m playwright install --with-deps chromium
      - name: Start isolated integration services
        run: docker compose --project-name sci-search-ci -f compose.integration.yml up --detach --wait --wait-timeout 120
      - name: Mandatory security isolation suite
        run: uv run python -m pytest -q -m security
      - run: uv run python -m pytest -q --junitxml=test-results-${{ matrix.python }}.xml
      - name: Stop isolated integration services
        if: always()
        run: docker compose --project-name sci-search-ci -f compose.integration.yml down --volumes --remove-orphans
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python }}
          path: test-results-${{ matrix.python }}.xml

  coverage-package-security:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.11
      - name: Install Python execution sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2
          # Ubuntu's runner policy otherwise denies bwrap's isolated loopback setup.
          # Enable user namespaces on this disposable CI VM; bwrap and seccomp still
          # enforce the application's network, filesystem and process isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify Python execution sandbox
        run: uv run python -m pytest tests/test_python_data_execution.py -q
      - name: Install browser test dependencies
        run: uv run python -m playwright install --with-deps chromium
      - name: Start isolated integration services
        run: docker compose --project-name sci-search-ci -f compose.integration.yml up --detach --wait --wait-timeout 120
      - run: uv run python -m pytest --cov=sci_search --cov-report=term-missing --cov-report=xml -q
      - name: Stop isolated integration services
        if: always()
        run: docker compose --project-name sci-search-ci -f compose.integration.yml down --volumes --remove-orphans
      - run: uv run python -m build
      - name: Install and smoke-test wheel
        run: |
          uv venv /tmp/sci-search-wheel --python 3.11
          uv pip install --python /tmp/sci-search-wheel/bin/python dist/sci_search-*.whl
          /tmp/sci-search-wheel/bin/sci-search --help
      - name: Audit locked third-party dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --quiet --output-file /tmp/sci-search-audit.txt
          uv run pip-audit --strict --requirement /tmp/sci-search-audit.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-distributions
          path: |
            coverage.xml
            dist/
