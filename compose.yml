name: sci-search

x-app: &app
  image: ${SCI_SEARCH_IMAGE:-sci-search:local}
  build:
    context: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp/sci-search:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
  environment: &app-environment
    SCI_SEARCH_ENVIRONMENT: production
    SCI_SEARCH_PUBLIC_BASE_URL: ${SCI_SEARCH_PUBLIC_BASE_URL:?set HTTPS public base URL}
    SCI_SEARCH_DATABASE_URL_FILE: /run/secrets/database_url
    SCI_SEARCH_REDIS_URL_FILE: /run/secrets/redis_url
    SCI_SEARCH_S3_ENDPOINT: http://minio:9000
    SCI_SEARCH_S3_BUCKET: sci-search
    SCI_SEARCH_S3_ACCESS_KEY_FILE: /run/secrets/minio_access_key
    SCI_SEARCH_S3_SECRET_KEY_FILE: /run/secrets/minio_secret_key
    SCI_SEARCH_SESSION_SECRET_FILE: /run/secrets/session_secret
    SCI_SEARCH_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    SCI_SEARCH_ALLOWED_ORIGINS: ${SCI_SEARCH_ALLOWED_ORIGINS:?set HTTPS allowed origin}
    SCI_SEARCH_OIDC_ISSUER: ${SCI_SEARCH_OIDC_ISSUER:?set OIDC issuer}
    SCI_SEARCH_OIDC_CLIENT_ID: ${SCI_SEARCH_OIDC_CLIENT_ID:?set OIDC client ID}
    SCI_SEARCH_OIDC_CALLBACK_URL: ${SCI_SEARCH_OIDC_CALLBACK_URL:?set HTTPS callback}
  secrets:
    - database_url
    - redis_url
    - minio_access_key
    - minio_secret_key
    - session_secret
    - oidc_client_secret
  networks:
    - backend
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SCI_SEARCH_HOSTNAME: ${SCI_SEARCH_HOSTNAME:?set public hostname}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ops@example.invalid}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  web:
    <<: *app
    command: ["web"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    profiles: ["admin"]
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
      - ./migrations:/app/migrations:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sci_search
      POSTGRES_USER: sci_search
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sci_search -d sci_search"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SCI_SEARCH_REDIS_PASSWORD:?set Redis password}"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$SCI_SEARCH_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      SCI_SEARCH_REDIS_PASSWORD: ${SCI_SEARCH_REDIS_PASSWORD:?set Redis password}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

secrets:
  database_url:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/database_url
  redis_url:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/redis_url
  postgres_password:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/postgres_password
  minio_access_key:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/minio_access_key
  minio_secret_key:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/minio_secret_key
  session_secret:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/session_secret
  oidc_client_secret:
    file: ${SCI_SEARCH_SECRETS_DIR:-./secrets}/oidc_client_secret
